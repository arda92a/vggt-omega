# Stage 2: scene attention, camera head, and depth head on mixed-scene bags.
# The backbone stays frozen. Inter-frame attention runs inside each group (routed after
# `route_layer`), so the frozen features are the ones the released model saw for one scene.
# The camera head runs once per group. Pose and point losses are computed per ground-truth
# scene and relative to the scene's first frame, because the network predicts each scene in
# its own gauge.
#
# From the repository root:
#   MERGED_DIR=... uv run python train.py --config multiscene_stage2 \
#     checkpoint.model_weight_path=logs/vggt_omega_multiscene_stage1/checkpoints/checkpoint.pt

defaults:
  - multiscene_stage1
  - _self_

exp_name: vggt_omega_multiscene_stage2
max_epochs: 10

model:
  multiscene:
    isolate_camera: true
    gt_group_prob: [0.5, 0.0]

loss:
  affinity:
    weight: 1.0
    route_weight: 1.0
    include_output: true
  camera:
    weight: 1.0
    weight_trans: 2.0
    weight_rot: 1.0
    weight_focal: 1.0
    normalize_trans_by_gt_scale: true
    weight_pairwise: 1.0
    pairwise_weight_rotation: 1.0
    pairwise_weight_translation: 1.0
  depth:
    weight: 1.0
    weight_normal: 0.0
    min_valid_pts: 100
    abs_l1_loss_ratio: 1.0
    rel_l1_loss_ratio: 0.2
    max_pixel_loss: 100.0
    use_conf_loss: false
    gradient_loss_config: null
  # 3D point error in the anchor camera frame of each scene.
  point:
    weight: 1.0
    min_valid_pts: 100
    abs_l1_loss_ratio: 1.0
    rel_l1_loss_ratio: 0.2
    max_pixel_loss: 100.0
  track: null

optim:
  frozen_module_names:
    - aggregator
  optimizer:
    lr: 1.0e-5
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 1.0e-5

validation:
  include_separate: true

logging:
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - ari
        - perfect_bags
        - pair_acc
        - count_acc
        - separated
        - together
        - route_ari
        - num_scenes
        - gt_group_prob
        - loss_camera
        - loss_depth
        - loss_point
        - Auc_30
        - abs_rel
