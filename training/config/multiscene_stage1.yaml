# Stage 1: train the two affinity heads on mixed-scene bags.
# The backbone, camera head, depth head, and scene-attention block stay frozen, so the
# only supervision is "which frames share a scene".
#
# From the repository root:
#   MERGED_DIR=/path/to/unified/merged \
#   uv run python train.py --config multiscene_stage1 \
#     checkpoint.model_weight_path=checkpoints/vggt_omega_1b_512.pt
#
# MERGED_DIR holds one folder per scene plus train.txt and val.txt, written by
# training/dataset_preparation/split_sequences.py. Validation reads val.txt only.
# Offline wandb: logging.wandb_writer.mode=offline. Off: logging.wandb_writer.enabled=false.

defaults:
  - default
  - _self_

exp_name: vggt_omega_multiscene_stage1
max_epochs: 20
limit_train_batches: 500

model:
  multiscene:
    enabled: true
    threshold: 0.5
    linkage: average
    num_heads: 16
    # Aggregator block after which the route head clusters frames. Later blocks attend inside a group.
    route_layer: 11
    isolate_backbone: true
    # Pose loss is off in this stage, so the camera head still sees the whole bag.
    isolate_camera: false
    # Chance of using ground-truth groups instead of predicted ones, annealed over training.
    gt_group_prob: [1.0, 0.2]

data:
  train:
    per_gpu_batch_scale: 0.5
    dataset:
      dataset_configs:
        # The released-model datasets from default.yaml are not used here.
        uco3d: null
        eden: null
        merged:
          _target_: data.datasets.unified.UnifiedDataset
          UNIFIED_DIR: ${oc.env:MERGED_DIR,/YOUR/PATH/TO/UNIFIED/merged}
          sequence_list_file: ${.UNIFIED_DIR}/train.txt
          val_sequence_list_file: ${.UNIFIED_DIR}/val.txt
          dataset_prefix: _merged
          is_synthetic: false
          mixture_weight: 100
          mixture_weight_scale: 1.0
          frame_window: 64
          sample_by_index: true
          revisit_policy: avoid_if_possible
    # One bag per step: S scenes with 3 to K frames each, shuffled. S = 1 keeps a single scene intact.
    mixed_scene:
      num_scenes_range: [1, 4]
      scene_count_weights: [0.1, 0.35, 0.3, 0.25]
      min_frames: 3
      frames_range: [3, 6]
      max_total_frames: 16
      shuffle_frames: true
      same_dataset_prob: 0.5
    common_config:
      frames_per_sample_range: [4, 6]
      fix_img_num: -1
      load_track: false

validation:
  enabled: true
  every_n_epochs: 1
  num_batches: 40
  num_workers: 2
  seed: 7
  at_start: true
  # Also forward every scene alone, the original model's behaviour. Costs one extra pass per scene.
  include_separate: false
  mixed_scene:
    num_scenes_range: [2, 4]
    min_frames: 3
    frames_range: [3, 6]
    max_total_frames: 16
    shuffle_frames: true
    same_dataset_prob: 0.5

loss:
  # Each scene is already in its own camera frame. Do not renormalize the packed bag.
  normalize_predictions: false
  normalize_gt: false
  camera: null
  depth: null
  point: null
  track: null
  affinity:
    weight: 1.0
    route_weight: 1.0
    # Scene attention is frozen in this stage, so the output affinity is not a target yet.
    include_output: false

optim:
  frozen_module_names:
    - aggregator
    - camera_head
    - dense_head
    - multiscene.scene_attention
  optimizer:
    lr: 3.0e-4
    weight_decay: 0.05
  # The default schedule also targets patch_embed. Those weights are frozen here, and a
  # pattern that matches nothing aborts optimizer setup.
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 3.0e-4
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: [multiscene]
        max_norm: 1.0
        norm_type: 2
      - module_name: [aggregator, patch_embed]
        max_norm: 1.0
        norm_type: 2
      - module_name: [dense_head]
        max_norm: 1.0
        norm_type: 2
      - module_name: [camera_head]
        max_norm: 1.0
        norm_type: 2

logging:
  wandb_writer:
    _target_: train_utils.wandb_logger.WandbLogger
    enabled: true
    project: vggt-omega-multiscene
    name: ${exp_name}
    entity: null
    mode: online
    dir: logs/${exp_name}/wandb
    step_freq: 10
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_affinity
        - loss_affinity_final
        - loss_affinity_route
        - affinity_f1
        - route_f1
        - group_agreement
        - route_group_agreement
        - ari
        - route_ari
        - exact_partition
        - route_exact_partition
        - scene_count_error
        - route_scene_count_error
        - num_scenes
        - num_frames
        - gt_group_prob
        - used_gt_groups
