[project]
name = "vggt-omega"
version = "0.0.1"
description = "VGGT-Omega feed-forward camera and depth reconstruction."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Jianyuan Wang", email = "jianyuan@robots.ox.ac.uk"},
]
dependencies = [
    "numpy<2",
    "Pillow",
    "einops",
    "safetensors",
    "opencv-python",
]

[project.optional-dependencies]
demo = [
    "gradio>=5.17.1",
    "viser>=0.2.23",
    "tqdm",
    "scipy",
    "trimesh",
    "matplotlib",
    "requests",
    "onnxruntime",
]
export = [
    "pycolmap>=3.10.0",
]
train = [
    "torch>=2.6",
    "torchvision>=0.21",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "fvcore",
    "tensorboard",
    "wcmatch",
    "wandb",
]
curation = [
    "catboost",
    "joblib",
    "lightgbm",
    "scikit-learn>=1.4",
    "scipy",
    "xgboost",
]

# `uv run` installs these groups by default, so `uv run python train.py` works after a plain checkout.
[dependency-groups]
train = [
    "torch>=2.6",
    "torchvision>=0.21",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "fvcore",
    "tensorboard",
    "wcmatch",
    "wandb",
]
dev = ["pytest"]

[tool.uv]
default-groups = ["train", "dev"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vggt_omega*"]
